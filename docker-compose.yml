services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    command: >
      bash -lc 'set -e;
      for plugin_dir in /var/www/project/wp-content/plugins/*; do
        [ -d "$$plugin_dir" ] || continue;
        plugin="$${plugin_dir##*/}";
        [ "$$plugin" = "shop-co-core" ] && continue;
        if [ ! -d "/var/www/html/wp-content/plugins/$$plugin" ]; then
          cp -a "$$plugin_dir" "/var/www/html/wp-content/plugins/$$plugin";
        fi;
      done;
      exec apache2-foreground'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      COMPOSER_ALLOW_SUPERUSER: 1
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - wordpress_plugins:/var/www/html/wp-content/plugins
      - ./wp-content/plugins/shop-co-core:/var/www/html/wp-content/plugins/shop-co-core
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./:/var/www/project

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-root}

volumes:
  wordpress_data:
  wordpress_plugins:
  db_data:
